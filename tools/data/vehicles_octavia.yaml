# Subset of standard Mode-01 PIDs expected from a legislative OBD-II engine
# ECU of this class (Simos 7.1, petrol, EOBD). NOT confirmed by measurement —
# support_level is 'expected'. Everything else stays 'unknown'.
expected_mode01_pids:
  - "00"  # supported PID bitmap (mandatory)
  - "01"  # monitor status
  - "02"  # freeze frame DTC
  - "03"  # fuel system status
  - "04"  # calculated load
  - "05"  # coolant temperature
  - "0B"  # MAP
  - "0C"  # RPM
  - "0D"  # vehicle speed
  - "0F"  # intake air temperature
  - "10"  # MAF
  - "11"  # throttle position
  - "13"  # O2 sensors present
  - "14"  # O2 B1S1
  - "15"  # O2 B1S2
  - "1C"  # OBD standard
  - "1F"  # runtime since start
  - "20"  # supported PID bitmap
  - "21"  # distance with MIL
  - "30"  # warmups since clear
  - "31"  # distance since clear
  - "33"  # barometric pressure
  - "40"  # supported PID bitmap
  - "41"  # monitor status this cycle
  - "42"  # control module voltage
  - "43"  # absolute load
  - "44"  # commanded equivalence ratio
  - "45"  # relative throttle position
  - "4D"  # time with MIL
  - "4E"  # time since clear
  - "50"  # max air flow
  - "51"  # fuel type
  - "5C"  # engine oil temperature
  - "60"  # supported PID bitmap
