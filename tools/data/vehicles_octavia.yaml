# Vehicle / ECU profile data imported by tools/build_db.py.
#
# Confidence values:
#   user_scan   — provided by the vehicle owner from a real VCDS scan (2026-11-20)
#   likely      — widely published public fact, not verified against official docs here
#   unverified  — placeholder / unknown
#
# Nothing here is guessed: absent characteristics stay absent ("Не определено"
# in the UI). No CAN identifiers are invented: diag_address stays NULL unless
# it is a public standard fact (functional tester address 0x7DF is standard).

data_sources:
  - id: vcds-scan-user
    name: Скан VCDS владельца (Skoda Octavia A5 2012, BSE)
    license: Данные, предоставленные владельцем автомобиля
    url: ""
    revision: "2026-11-20"
    notes: Парт-номера ЭБУ и конфигурация из скана VCDS, предоставленного владельцем.
  - id: public-standards
    name: Публичные сведения о стандартах (SAE J1979, ISO 14229, ISO 15765-4)
    license: Общеизвестные факты о стандартах (краткое изложение)
    url: https://www.sae.org/standards/
    notes: Только общеизвестные факты стандартов; тексты стандартов не включаются.
  - id: public-catalogs
    name: Публичные каталоги и энциклопедии (характеристики, семейства контроллеров)
    license: Общеизвестные автомобильные факты (краткое изложение)
    url: ""
    notes: Семейства контроллеров и характеристики двигателей, широко опубликованные в открытых источниках; прямое копирование текстов отсутствует.
  - id: translate-rules
    name: Правило-ориентированный переводчик tools/translate.py
    license: Производные переводы исходных описаний (те же лицензии, что у источников)
    url: ""
    notes: Детерминированные правила «компонент + неисправность». Статус перевода — auto.

