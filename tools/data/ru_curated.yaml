# Long-form Russian explanations for the most common codes (GENERIC).
details:
  P0300:
    detail: >
      ЭБУ зафиксировал пропуски воспламенения сразу в нескольких цилиндрах или
      случайные пропуски без привязки к конкретному цилиндру. Причина может быть
      как в системе зажигания (свечи, катушки), так и в подаче топлива/воздуха,
      подсосе воздуха, низкой компрессии. При активных пропусках ЭБУ может
      отключать форсунку проблемного цилиндра для защиты катализатора.
    recommendations: >
      1) Проверить свечи зажигания (износ, зазор, следы масла) и катушки. 2)
      Проверить подсос воздуха (патрубки, прокладки впуска, вакуумные шланги).
      3) Проверить показания коррекций топлива (PID 06/07) и MAF. 4) Если
      пропуски продолжаются — проверить компрессию. 5) Не двигаться в режиме
      активных пропусков (мигающая лампа Check Engine) — есть риск выжигания
      катализатора.
  P0301:
    detail: >
      Пропуски воспламенения в цилиндре 1: смесь не воспламеняется или
      воспламеняется нестабильно. Типичные причины — свеча, катушка, форсунка,
      подсос воздуха в этот цилиндр, низкая компрессия.
    recommendations: >
      1) Поменять местами свечу/катушку цилиндра 1 с другим цилиндром — если
      пропуск «переехал», неисправен элемент. 2) Осмотреть свечу. 3) Проверить
      форсунку (сопротивление, баланс). 4) Проверить компрессию цилиндра.
  P0171:
    detail: >
      Смесь в банке 1 слишком бедная: расчётное количество топлива недостаточно.
      ЭБУ компенсирует это коррекциями топлива (PID 06/07 выходят на предел).
      Типичные причины — подсос неучтённого воздуха после расходомера, слабая
      подача топлива, неисправный/загрязнённый MAF, неверные показания датчика
      кислорода.
    recommendations: >
      1) Посмотреть LTFT/STFT на холостом ходу и при 2500 об/мин: если на
      холостом ходу беднее — искать подсос воздуха, если одинаково везде —
      проверять MAF и давление топлива. 2) Осмотреть патрубки впуска и шланг
      вентиляции картера. 3) Сравнить показания MAF с ожидаемыми (PID 10).
      4) Проверить давление топлива.
  P0172:
    detail: >
      Смесь в банке 1 слишком богатая: топлива подаётся больше, чем нужно.
      Возможные причины — повышенное давление топлива, негерметичная форсунка,
      неисправный MAF/датчик кислорода, завышенная подача из-за коррекций,
      загрязнённый воздушный фильтр.
    recommendations: >
      1) Проверить давление топлива в рампе. 2) Проверить MAF и воздушный
      фильтр. 3) Посмотреть показания датчика кислорода (PID 14) — «залипший»
      на богатом датчик даёт ложную бедную картину. 4) Проверить затопление
      цилиндра топливом.
  P0420:
    detail: >
      ЭБУ оценивает эффективность нейтрализатора по разнице сигналов двух
      датчиков кислорода и фиксирует, что катализатор нейтрализует выхлоп хуже
      порога. Частая причина — деградация нейтрализатора, но код может давать
      и неисправный/глухой задний ДК, и утечка выхлопа перед ним.
    recommendations: >
      1) Убедиться в отсутствии утечек выхлопа до заднего ДК. 2) Сравнить
      сигналы переднего и заднего ДК (PID 14/15): у рабочего катализатора
      задний сигнал стабилен. 3) Проверить температуру катализатора. 4) Только
      после этого — вывод о замене катализатора.
  P0430:
    detail: >
      Аналогично P0420, но для банка 2 (для V-образных двигателей).
    recommendations: >
      Проверить банк 2: утечки выхлопа, сравнение сигналов ДК банка 2, состояние
      катализатора банка 2.
  P0101:
    detail: >
      Сигнал расходомера воздуха не согласуется с другими параметрами
      (положением дросселя, оборотами, давлением). Частые причины — загрязнение
      нити/плёнки MAF, подсос воздуха после MAF, деградация датчика.
    recommendations: >
      1) Осмотреть и очистить MAF (спреем для MAF, не механически). 2) Проверить
      подсос воздуха после расходомера. 3) Сравнить показания MAF с ожидаемыми
      для оборотов. 4) Проверить разъём и проводку датчика.
  P0299:
    detail: >
      ЭБУ зафиксировал давление наддува ниже запрошенного. Причины: негерметич-
      ность тракта наддува (патрубки интеркулера), залипший/изношенный wastegate
      или привод, неисправный датчик давления, засорение турбины.
    recommendations: >
      1) Осмотреть патрубки наддува и интеркулер на утечки (дымогенератор или
      на слух). 2) Проверить актуатор wastegate и вакуумные линии. 3) Сравнить
      показания датчика давления наддува с целевыми. 4) Проверить свободное
      вращение турбины.
  P0401:
    detail: >
      Недостаточный поток рециркуляции отработавших газов: EGR открывается, но
      газов проходит меньше, чем ожидается. Обычно — закоксовка каналов или
      клапана EGR, неисправный датчик положения/расхода.
    recommendations: >
      1) Снять и осмотреть клапан EGR, очистить каналы. 2) Проверить вакуумные/
      электрические линии управления. 3) Проверить датчик положения EGR.
  P0442:
    detail: >
      В системе улавливания паров топлива обнаружена небольшая утечка (обычно
      порог ~0,04 дюйма). Причины — неплотная крышка бака, треснувший шланг,
      клапан продувки/вентиляции, датчик давления.
    recommendations: >
      1) Подтянуть/заменить крышку бака. 2) Осмотреть шланги EVAP. 3) Тест
      дымогенератором. 4) Проверить клапаны продувки и вентиляции.
  P0455:
    detail: >
      Значительная утечка в системе EVAP — часто неплотно закрученная или
      неисправная крышка бака, оборванный шланг.
    recommendations: >
      1) Проверить крышку бака (уплотнение, фиксация). 2) Осмотреть шланги
      EVAP и корпус бака. 3) Тест дымогенератором.
  P0500:
    detail: >
      ЭБУ не получает корректный сигнал скорости автомобиля. У большинства
      машин сигнал идёт от датчиков ABS через CAN; причины — датчик скорости/
      ДСК колеса, проводка, отсутствие согласования на шине.
    recommendations: >
      1) Проверить работу спидометра и ABS. 2) Считать ошибки ABS. 3) Проверить
      проводку датчика скорости.
  P0562:
    detail: >
      Напряжение бортовой сети ниже нормы (< ~10 В на ЭБУ). Причины: слабый
      аккумулятор, неисправный генератор/регулятор, плохие контакты клемм и
      массовых проводов.
    recommendations: >
      1) Измерить напряжение на клеммах при заглушенном и работающем двигателе
      (PID 42). 2) Проверить клеммы и массы. 3) Проверить генератор.
  P0700:
    detail: >
      Это общий код ЭБУ двигателя: блок трансмиссии (TCM) сообщил об ошибке
      через CAN. Конкретная причина — в кодах TCM, которые стандартным
      OBD-сканером могут не читаться (нужен VAG-диагностический транспорт).
    recommendations: >
      1) Не спешить с заменой деталей: ошибка в TCM. 2) По возможности считать
      ошибки блока АКПП диагностикой VAG. 3) Проверить уровень/состояние
      жидкости АКПП.
  P0715:
    detail: >
      Неисправность датчика скорости входного вала АКПП: TCM не видит оборотов
      входного вала, из-за чего может уходить в аварийный режим.
    recommendations: >
      1) Считать ошибки TCM. 2) Проверить проводку датчика. 3) Проверить
      уровень жидкости АКПП.
  U0100:
    detail: >
      Нет связи с ЭБУ двигателя по CAN. Для одного блока-наблюдателя причины:
      обрыв/КЗ на CAN-H/CAN-L, потеря питания/массы ЭБУ, неисправность самого
      блока. Если машина заводится и едет — часто это временный обрыв связи
      наблюдателя с шиной.
    recommendations: >
      1) Проверить питание и массы ЭБУ. 2) Проверить сопротивление CAN-шины
      (60 Ом между CAN-H и CAN-L при выключенном питании). 3) Осмотреть
      разъёмы ЭБУ.
  U0101:
    detail: >
      Нет связи с блоком управления трансмиссией по CAN. Возможны проблемы
      связи с шиной или питания TCM; АКПП может уйти в аварийный режим.
    recommendations: >
      1) Проверить питание/массы TCM. 2) Проверить CAN-линии к TCM. 3) Считать
      ошибки TCM напрямую (VAG-диагностика).
  P0087:
    detail: >
      Давление топлива в рампе ниже целевого. Для MPI — слабая подача (насос,
      фильтр); для непосредственного впрыска/дизеля — регулятор давления, ТНВД,
      датчик давления.
    recommendations: >
      1) Замерить давление топлива механическим манометром. 2) Заменить
      топливный фильтр. 3) Проверить напряжение питания насоса. 4) Для
      непосредственного впрыска — диагностика регулятора/ТНВД.
  P0130:
    detail: >
      Неисправность цепи переднего датчика кислорода (банк 1, датчик 1):
      ЭБУ видит некорректный сигнал цепи — обрыв, КЗ, нагрев не выходит на
      режим.
    recommendations: >
      1) Проверить разъём и проводку ДК. 2) Проверить нагреватель (PID 14,
      сопротивление нагревателя). 3) Осмотреть датчик на повреждения/сажу.
  P0128:
    detail: >
      Двигатель не достигает расчётной рабочей температуры за ожидаемое время.
      Классическая причина — термостат, заклинивший в открытом состоянии; реже
      — неисправный датчик температуры ОЖ.
    recommendations: >
      1) Сравнить показания температуры ОЖ с фактическим прогревом. 2) Проверить
      термостат (верхний патрубок должен прогреваться по мере прогрева). 3)
      Уровень ОЖ.
  P0327:
    detail: >
      Слабый сигнал датчика детонации: ЭБУ не может распознать детонацию и
      уходит на более позднее зажигание (потеря мощности возможна).
    recommendations: >
      1) Проверить затяжку датчика детонации (момент затяжки важен). 2) Проверить
      проводку и разъём. 3) Осмотреть датчик на повреждения.
  P0335:
    detail: >
      Нет корректного сигнала датчика положения коленвала. Без ДПКВ двигатель
      может не запускаться или глохнуть. Причины: датчик, проводка, заден
      венец/зазор.
    recommendations: >
      1) Проверить сопротивление/сигнал датчика. 2) Проверить проводку и
      разъём. 3) Осмотреть венец коленвала.
